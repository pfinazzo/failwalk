<!doctype html>
<html lang="en">

<style>
/* The same dark look as the system map, so the two pages read as one family. */
:root {
  --bg: #070b14;
  --panel: rgba(13, 19, 34, 0.86);
  --panel-solid: #0f1627;
  --line: rgba(148, 163, 184, 0.16);
  --line-strong: rgba(148, 163, 184, 0.32);
  --text: #e6ecf5;
  --muted: #94a3b8;
  --faint: #64748b;
  --accent: #7dd3fc;
  --coped: #34d399;
  --uncaught: #fb7185;
  --risk: #fbbf24;
  --unreached: #64748b;
  --tests: #94a3b8;
  --radius: 14px;
  --panel-w: 440px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; overflow: hidden; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
#stage { position: fixed; inset: 0; }
#labels { position: fixed; inset: 0; pointer-events: none; }

/* Top bar */
.topbar { position: fixed; top: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; gap: 16px; padding: 0 18px; z-index: 20;
  background: linear-gradient(180deg, rgba(7,11,20,0.95), rgba(7,11,20,0.6)); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.2px; white-space: nowrap; }
.brand small { color: var(--muted); font-weight: 500; }
.tabs { display: flex; gap: 4px; background: rgba(148,163,184,0.08); border: 1px solid var(--line); padding: 4px; border-radius: 12px; }
.tab { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: 13.5px; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.on { background: rgba(125, 211, 252, 0.14); color: var(--text); box-shadow: inset 0 0 0 1px rgba(125,211,252,0.35); }
.spacer { flex: 1; }
.built { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1100px) { .built, .brand small { display: none; } }
.iconbtn { border: 1px solid var(--line); background: rgba(148,163,184,0.06); border-radius: 10px; padding: 7px 11px; cursor: pointer; color: var(--muted); font-size: 13px; white-space: nowrap; }
.iconbtn:hover { color: var(--text); border-color: var(--line-strong); }

/* Side index */
.index { position: fixed; top: 60px; left: 0; bottom: 0; width: 290px; z-index: 12; background: var(--panel); border-right: 1px solid var(--line); backdrop-filter: blur(12px);
  display: flex; flex-direction: column; transition: transform .3s ease; }
.index.closed { transform: translateX(-100%); }
.index header { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.search { width: 100%; background: rgba(148,163,184,0.08); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; color: var(--text); font: inherit; font-size: 13.5px; outline: none; }
.search:focus { border-color: rgba(125,211,252,0.5); }
.index .scroll { overflow: auto; padding: 8px 8px 30px; flex: 1; }
.sec { margin: 12px 6px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--faint); }
.item { display: flex; gap: 9px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 13.5px; }
.item:hover { background: rgba(148,163,184,0.08); color: var(--text); }
.item.on { background: rgba(125,211,252,0.12); color: var(--text); }
.item .sw { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.item .sq { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.item.l1 { padding-left: 22px; font-size: 13px; }
.item .count { margin-left: auto; font-size: 11px; color: var(--faint); }
.item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Detail panel */
.panel { position: fixed; top: 60px; right: 0; bottom: 0; width: var(--panel-w); z-index: 16; background: var(--panel); border-left: 1px solid var(--line); backdrop-filter: blur(14px);
  transform: translateX(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
.panel.open { transform: translateX(0); }
.panel .head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); position: relative; }
.panel .kind { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); display: flex; gap: 8px; align-items: center; padding-right: 40px; }
.panel .kind .sw { width: 10px; height: 10px; border-radius: 50%; }
.panel h2 { margin: 8px 0 6px; font-size: 20px; line-height: 1.25; letter-spacing: -0.01em; word-break: break-word; }
.panel .simple { color: #cbd5e1; font-size: 14.5px; line-height: 1.55; margin: 0; }
.panel .close { position: absolute; top: 14px; right: 14px; }
.panel .body { overflow: auto; padding: 6px 20px 40px; flex: 1; }
.panel h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--faint); margin: 22px 0 10px; font-weight: 600; }
.panel p { color: #cbd5e1; line-height: 1.6; font-size: 14px; margin: 0 0 10px; }
.code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12.5px; background: rgba(148,163,184,0.1); border: 1px solid var(--line); padding: 2px 6px; border-radius: 6px; color: #e2e8f0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 7px; align-items: center; border: 1px solid var(--line); background: rgba(148,163,184,0.06); border-radius: 999px; padding: 5px 11px 5px 9px; font-size: 13px; cursor: pointer; color: var(--text); text-align: left; max-width: 100%; }
.chip:hover { border-color: var(--line-strong); background: rgba(148,163,184,0.12); }
.chip .sw { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip .sq { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.chip.check { color: var(--risk); border-color: rgba(251,191,36,0.4); cursor: default; }
/* One failure mode of the site, with its colour, verdict and note. */
.cellrow { display: grid; grid-template-columns: 14px 92px 1fr; gap: 10px; align-items: baseline; padding: 9px 10px; border: 1px solid var(--line); border-radius: 11px; margin-bottom: 6px; cursor: pointer; }
.cellrow:hover { border-color: var(--line-strong); background: rgba(148,163,184,0.06); }
.cellrow.on { border-color: rgba(125,211,252,0.6); background: rgba(125,211,252,0.08); }
.cellrow .sq { width: 10px; height: 10px; border-radius: 3px; transform: translateY(1px); }
.cellrow .mode { font-family: "JetBrains Mono", monospace; font-size: 12.5px; color: var(--text); }
.cellrow .note { font-size: 13px; color: var(--muted); line-height: 1.45; word-break: break-word; }
.cellrow .note b { color: var(--text); font-weight: 600; }
.callout { border-left: 3px solid var(--accent); background: rgba(125,211,252,0.06); padding: 10px 12px; border-radius: 0 10px 10px 0; color: #cbd5e1; font-size: 14px; line-height: 1.55; margin: 10px 0; }
.callout.warn { border-color: var(--risk); background: rgba(251,191,36,0.06); }
.dcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; background: rgba(125,211,252,0.04); transition: border-color .2s, background .2s; }
.dcard:hover { border-color: rgba(125,211,252,0.5); background: rgba(125,211,252,0.08); }
.dcard .t { font-weight: 600; font-size: 14px; }
.dcard .w { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.5; }
.legendlist { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.legendlist li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: baseline; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.legendlist li b { color: var(--text); }
.legendlist .sq { width: 10px; height: 10px; border-radius: 3px; transform: translateY(1px); }

/* Flow-style player, used by the walkthrough */
.player { position: fixed; left: calc(var(--free-left, 0px) + 16px); right: calc(var(--free-right, 0px) + 16px); bottom: 16px; margin: 0 auto; max-width: 760px; z-index: 16;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 16px; padding: 14px 16px; backdrop-filter: blur(14px); display: none; box-shadow: 0 20px 60px rgba(0,0,0,0.45); }
.player.on { display: block; }
.player .top { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.player select { background: rgba(148,163,184,0.1); border: 1px solid var(--line); color: var(--text); border-radius: 9px; padding: 6px 9px; font: inherit; font-size: 13.5px; max-width: 60%; }
.player .say { font-size: 17px; line-height: 1.45; font-weight: 600; margin: 4px 0 4px; }
.player .more { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0; }
.player .ctrls { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
.player .ctrls .num { color: var(--faint); font-size: 13px; margin-right: auto; }
.btn[hidden] { display: none; }
.btn { border: 1px solid var(--line-strong); background: rgba(148,163,184,0.08); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.btn:hover { background: rgba(148,163,184,0.16); }
.btn.primary { background: var(--accent); color: #04121c; border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.tourtag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); color: var(--faint); }
.tourtag:empty { display: none; }
.tourtag.uncaught { color: var(--uncaught); border-color: rgba(251,113,133,0.45); }
.tourtag.risk { color: var(--risk); border-color: rgba(251,191,36,0.4); }
.tourtag.unreached { color: var(--muted); border-color: var(--line-strong); }
.tourtag.coped { color: var(--coped); border-color: rgba(52,211,153,0.4); }
.player #tourExit { margin-left: auto; }
.tourbar { height: 4px; border-radius: 4px; background: rgba(148,163,184,0.18); overflow: hidden; margin: 2px 0 10px; }
.tourbar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
body.touring .legend, body.touring .hint { display: none; }
.resume { position: fixed; top: 76px; left: var(--mid, 50%); transform: translateX(-50%); z-index: 17; border: 1px solid rgba(125,211,252,0.7); background: rgba(10,18,32,0.94); color: var(--text); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 13.5px; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.45); white-space: nowrap; }
.resume:hover { background: rgba(125,211,252,0.18); }
.resume[hidden] { display: none; }
@media (max-height: 560px) { .player .more, .player .tourtag { display: none; } .player .say { font-size: 14.5px; margin: 0; } }

/* Legend, hint, tooltip */
.legend { position: fixed; left: calc(var(--free-left, 0px) + 16px); bottom: 18px; z-index: 11; display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 12px; color: var(--muted);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; backdrop-filter: blur(10px); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.legend i.round { border-radius: 50%; }
.hint { position: fixed; right: calc(var(--free-right, 0px) + 16px); bottom: 18px; z-index: 11; font-size: 12px; color: var(--faint); }
#tip { position: fixed; z-index: 30; pointer-events: none; display: none; max-width: 340px; background: var(--panel-solid); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; line-height: 1.4; color: var(--text); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
#tip small { display: block; color: var(--muted); margin-top: 3px; }

/* Labels drawn in the scene. The wrapper has no size, so each label is placed around the point it marks. */
.lw { pointer-events: none; width: 0; height: 0; overflow: visible; }
.lab { position: absolute; pointer-events: auto; cursor: pointer; white-space: nowrap; padding: 3px 8px; border-radius: 8px; font-size: 11px; font-weight: 600;
  background: rgba(7,11,20,0.82); border: 1px solid var(--line); color: var(--text); transition: opacity .25s; }
.lab.wrapper { left: 0; top: 0; transform: translate(-50%, 0); font-size: 13px; padding: 5px 10px; border-radius: 10px; text-align: center; }
.lab.wrapper .sub { display: block; font-size: 10.5px; font-weight: 500; color: var(--muted); margin-top: 2px; }
.lab .badge { margin-left: 6px; font-size: 9.5px; color: #04121c; background: var(--accent); border-radius: 999px; padding: 1px 6px; font-weight: 700; }
.lab.site { right: 0; top: 0; transform: translate(-6px, -50%); text-align: right; }
.lab.site .sub { display: block; font-family: "JetBrains Mono", monospace; font-size: 9.5px; font-weight: 500; color: var(--muted); margin-top: 1px; }
.lab.test { left: 0; top: 0; transform: translate(-50%, -100%) translateY(-8px); max-width: 180px; white-space: normal; text-align: center; font-size: 10.5px; font-weight: 500; color: #cbd5e1; }
.lab.halo { pointer-events: none; background: none; border: 0; font-size: 10px; font-weight: 600; color: var(--faint); letter-spacing: 0.12em; text-transform: uppercase; }
.lab.file { right: 0; top: 0; transform: translate(-6px, -50%); font-family: "JetBrains Mono", monospace; letter-spacing: 0; text-transform: none; font-size: 10px; color: var(--muted); }
.lab.mode { left: 0; bottom: 0; transform: translate(-4px, 0) rotate(-45deg); transform-origin: left bottom; font-family: "JetBrains Mono", monospace; letter-spacing: 0; text-transform: none; font-size: 10.5px; color: var(--muted); }

/* The greeting */
.intro { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: radial-gradient(1200px 600px at 50% 40%, rgba(15,25,45,0.85), rgba(4,7,14,0.96)); }
.intro.gone { display: none; }
.intro .card { width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel-solid); border: 1px solid var(--line-strong); border-radius: 22px; padding: 30px 32px; box-shadow: 0 30px 90px rgba(0,0,0,0.55); }
.intro h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -0.02em; }
.intro h1 small { color: var(--muted); font-size: 15px; font-weight: 500; margin-left: 10px; }
.intro p { color: #cbd5e1; line-height: 1.6; font-size: 15.5px; margin: 0 0 12px; }
.intro .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0 18px; }
.intro .row div { border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.intro .row b { display: block; color: var(--text); margin-bottom: 4px; font-size: 22px; }
.intro .ask { color: var(--text); font-size: 17px; font-weight: 600; margin: 18px 0 14px; }
.intro .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.intro .choice { text-align: left; border: 1px solid var(--line-strong); background: rgba(148,163,184,0.06); border-radius: 14px; padding: 14px 16px; cursor: pointer; color: var(--text); }
.intro .choice:hover { border-color: rgba(125,211,252,0.6); background: rgba(125,211,252,0.08); }
.intro .choice.primary { border-color: rgba(125,211,252,0.7); background: rgba(125,211,252,0.12); }
.intro .choice b { display: block; font-size: 15.5px; margin-bottom: 6px; }
.intro .choice span { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
@media (max-width: 640px) { .intro .choices, .intro .row { grid-template-columns: 1fr; } }
.nogl { position: fixed; inset: 60px 0 0 290px; display: none; place-items: center; color: var(--muted); z-index: 1; text-align: center; padding: 30px; }
@media (max-width: 900px) { .index { width: 100vw; } .panel { width: 100vw; } .legend { display: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div class="nogl" id="nogl">3D isn't available in this browser. The index on the left and the detail panel still work: pick any wrapper, call site or test.</div>

<div class="topbar">
  <button class="iconbtn" id="toggleIndex" title="Show or hide the index">☰ Index</button>
  <div class="brand" id="brand"></div>
  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" data-view="tour">Walkthrough</button>
    <button class="tab on" data-view="explore">Explore</button>
  </div>
  <div class="spacer"></div>
  <span class="built" id="built" title="When the data was written"></span>
  <button class="iconbtn" id="helpBtn">How to read this</button>
</div>

<aside class="index" id="index">
  <header><input class="search" id="search" placeholder="Search call sites and tests…" /></header>
  <div class="scroll" id="indexList"></div>
</aside>

<aside class="panel" id="panel">
  <div class="head" id="panelHead"></div>
  <div class="body" id="panelBody"></div>
</aside>

<!-- Shown while the walkthrough is paused because the person clicked something: one click goes back to the same step. -->
<button class="resume" id="tourResume" hidden>↩ Back to the walkthrough · <span id="tourResumeStep"></span></button>

<!-- The guided walkthrough's controls: where it is, what it says, and Back, Next and Exit. -->
<div class="player" id="tour">
  <div class="top">
    <select id="tourChapter" aria-label="Jump to a chapter"></select>
    <span class="tourtag" id="tourTag"></span>
    <button class="btn" id="tourExit">Exit walkthrough</button>
  </div>
  <div class="tourbar" aria-hidden="true"><i id="tourBar"></i></div>
  <p class="say" id="tourSay"></p>
  <p class="more" id="tourMore"></p>
  <div class="ctrls">
    <span class="num" id="tourNum"></span>
    <button class="btn" id="tourPrev">Back</button>
    <button class="btn primary" id="tourNext">Next</button>
  </div>
</div>

<div class="legend" id="legend"></div>
<div class="hint" id="hint">Drag to turn · right-drag or shift-drag to pan · scroll to zoom · click anything</div>
<div id="tip"></div>

<div class="intro" id="intro"><div class="card" id="introCard"></div></div>

<!-- The scene: the inventory, the trace and the run, shaped by failwalk ui. -->
<script type="application/json" id="failwalk-data">__FAILWALK_DATA__</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ------------------------------------------------------------------ */
/* Data                                                                */
/* ------------------------------------------------------------------ */
const SCENE = JSON.parse(document.getElementById('failwalk-data').textContent);
const MODES = SCENE.modes;
const SITES = SCENE.sites;
const TESTS = SCENE.tests;
const WRAPPERS = SCENE.wrappers;
const SITE = Object.fromEntries(SITES.map((s) => [s.id, s]));
const TEST = Object.fromEntries(TESTS.map((t) => [t.label, t]));
const WRAPPER = Object.fromEntries(WRAPPERS.map((w) => [w.name, w]));
const PROJECT = SCENE.root.split(/[\\/]/).filter(Boolean).pop() || SCENE.root;

/** The colour of each cell state, as the legend and the scene draw it. */
const STATE_COLORS = { coped: '#34d399', uncaught: '#fb7185', risk: '#fbbf24', unreached: '#475569' };
/** What each colour means, in one sentence. */
const STATE_TEXT = {
  coped: 'A test reached the call with this failure injected and the code coped: the tests passed, or a test asserted on the failure path.',
  uncaught: 'The failure was injected and nothing caught it: an unhandled error, a dead runner, or a test that waited until its own timeout.',
  risk: 'The tests passed, but a static check found a pattern that passing hides, such as a retry without an idempotency key.',
  unreached: 'No test reaches this call site, or no run has filled the cell yet. Nobody has walked this failure path.',
};
const STATE_NAMES = { coped: 'Coped', uncaught: 'Uncaught', risk: 'Risk', unreached: 'Nobody walked it' };
/** The worst state first, for sorting and for the walkthrough's order. */
const STATE_ORDER = ['uncaught', 'risk', 'unreached', 'coped'];
/** Each failure mode in plain words: what the injected call does instead of reaching the vendor. */
const MODE_TEXT = {
  timeout: 'the call never answers',
  dropped: 'the connection drops',
  500: 'the vendor answers with a 500 error',
  429: 'the vendor answers with a 429, too many requests',
  malformed: 'the vendor answers with an empty object',
  partial: 'the vendor answers with half the result',
};
const modeText = (mode) => MODE_TEXT[mode] || `the failure "${mode}" is injected`;
/** Each verdict in plain words. */
const VERDICT_TEXT = {
  PASS: 'the tests passed, so the code coped, or the tests never looked',
  FAIL: 'a test assertion failed: the code noticed and a test caught it',
  CRASH: 'nothing caught it: an unhandled error, or the runner died',
  HANG: 'the test hit its own timeout: the code waited forever',
  RISK: 'the tests passed, but a static check found a pattern that passing hides',
  UNREACHED: 'no test reaches this call site',
};
const verdictText = (verdict) => (verdict ? VERDICT_TEXT[verdict] || `the run said ${verdict}` : 'no verdict yet');
/** One colour per wrapper, in order; green is kept for coped cells. */
const WRAPPER_PALETTE = ['#5aa0ff', '#a78bfa', '#f472b6', '#7dd3fc', '#fb923c', '#2dd4bf', '#e879f9', '#facc15'];
const wrapperColor = (name) => WRAPPER_PALETTE[WRAPPERS.findIndex((w) => w.name === name) % WRAPPER_PALETTE.length];
const TEST_COLOR = '#94a3b8';

const $ = (sel) => document.querySelector(sel);

const wrapperSites = (name) => WRAPPER[name].sites.map((id) => SITE[id]);

const editorUrl = (site) => `vscode://file/${SCENE.root.replace(/\\/g, '/')}/${site.file}:${site.line}`;

/* ------------------------------------------------------------------ */
/* Layout: every wrapper is a block of rows; tests float behind.       */
/* ------------------------------------------------------------------ */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
/* Row and column spacing in scene units. A site's label sits to the left of its node, so each block leaves room for the labels of the next. */
const ROW_H = 3.1, FILE_GAP = 2.6, CELL_STEP = 2.0, CELL_X0 = 4.2, BLOCK_GAP = 24, TEST_Z = -22, TEST_STEP = 6;
const POS = {};
const HEADS = [];
let cursorX = 0, minY = 0;
WRAPPERS.forEach((w) => {
  const width = CELL_X0 + MODES.length * CELL_STEP;
  let y = 0;
  const sites = wrapperSites(w.name);
  wrapperFiles(w.name).forEach((file) => {
    y -= FILE_GAP;
    HEADS.push({ cls: 'file', text: file, pos: V(cursorX - 0.2, y + 0.2, 0) });
    sites.filter((s) => s.file === file).forEach((s) => {
      y -= ROW_H;
      POS['s:' + s.id] = V(cursorX, y, 0);
      MODES.forEach((m, k) => { POS[`c:${s.id}|${m}`] = V(cursorX + CELL_X0 + k * CELL_STEP, y, 0); });
    });
  });
  MODES.forEach((m, k) => HEADS.push({ cls: 'mode', text: m, pos: V(cursorX + CELL_X0 + k * CELL_STEP, 0.6, 0) }));
  POS['w:' + w.name] = V(cursorX + width / 2 - 1, 12, 0);
  minY = Math.min(minY, y);
  cursorX += width + BLOCK_GAP;
});
const TOTAL_W = Math.max(cursorX - BLOCK_GAP, 20);
const PER_ROW = Math.max(4, Math.floor(TOTAL_W / TEST_STEP));
TESTS.forEach((t, i) => {
  const row = Math.floor(i / PER_ROW), inRow = Math.min(PER_ROW, TESTS.length - row * PER_ROW), col = i % PER_ROW;
  const x = (TOTAL_W - 2) / 2 + (col - (inRow - 1) / 2) * TEST_STEP;
  /* Tests float behind the board in rows, every other one a little higher, so neighbouring labels have room. */
  POS['t:' + t.label] = V(x, 9 + row * 5 + (col % 2) * 2.2, TEST_Z - row * 5);
});

/* ------------------------------------------------------------------ */
/* Scene                                                               */
/* ------------------------------------------------------------------ */
const gl = (() => { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; } })();
let scene, camera, renderer, labelRenderer, controls, glowTex, camTween = null;

const edges = [];
const haloLabels = [];
const clock = new THREE.Clock();
const view = { name: 'explore', focus: null, highlight: null, hover: null };
const tour = { isOn: false, step: 0, isSteering: false };

function makeGlowTexture() {

  const g = c.getContext('2d'); const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,0.9)'); grd.addColorStop(0.25, 'rgba(255,255,255,0.35)'); grd.addColorStop(1, 'rgba(255,255,255,0)');

}
function makeLabel(html, cls) {
  const wrap = document.createElement('div'); wrap.className = 'lw';
  const el = document.createElement('div'); el.className = `lab ${cls}`; el.innerHTML = html;
  wrap.appendChild(el); const obj = new CSS2DObject(wrap); obj.inner = el; return obj;
}
/** One node: a mesh, its glow, its label, and the opacity the highlight drives. */
function addNode({ id, mesh, color, glowScale, label, pos, baseOpacity = 1 }) {

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
  glow.scale.setScalar(glowScale); group.add(glow);

    label.inner.addEventListener('mouseenter', () => hover(id)); label.inner.addEventListener('mouseleave', () => hover(null));
  }

}
function initScene() {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x070b14, 1);
  $('#stage').appendChild(renderer.domElement);
  labelRenderer = new CSS2DRenderer({ element: $('#labels') });
  labelRenderer.setSize(innerWidth, innerHeight);

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x070b14, 0.0025);
  camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 2000);
  camera.position.set(TOTAL_W / 2, 10, 90);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.zoomSpeed = 2.5; controls.zoomToCursor = true; controls.minDistance = 4; controls.maxDistance = 400;
  controls.target.set(TOTAL_W / 2, minY / 2, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const d = new THREE.DirectionalLight(0xffffff, 1.0); d.position.set(30, 60, 80); scene.add(d);
  const d2 = new THREE.DirectionalLight(0x88aaff, 0.5); d2.position.set(-60, -30, -40); scene.add(d2);

  const sg = new THREE.BufferGeometry(); const N = 1400; const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) { const r = 260 + Math.random() * 500; const t = Math.random() * Math.PI * 2; const ph = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(t); pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(t); pos[i * 3 + 2] = r * Math.cos(ph); }
  sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0x8aa0c8, size: 1.1, transparent: true, opacity: 0.5, fog: false })));
  glowTex = makeGlowTexture();

  WRAPPERS.forEach((w) => {
    const color = new THREE.Color(wrapperColor(w.name));
    const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(2.1, 1), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.45, roughness: 0.35, metalness: 0.1, transparent: true, flatShading: true }));
    const label = makeLabel(`${esc(w.name)}<span class="badge">${w.sites.length}</span><span class="sub">${plural(w.sites.length, 'call site')} in ${plural(wrapperFiles(w.name).length, 'file')}</span>`, 'wrapper');
    label.position.set(0, -3, 0);
    addNode({ id: 'w:' + w.name, mesh, color, glowScale: 10, label, pos: POS['w:' + w.name] });
  });
  const cellGeo = new THREE.BoxGeometry(1.5, 1.5, 0.5);
  SITES.forEach((s) => {
    const color = new THREE.Color(wrapperColor(s.wrapper));
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.85, 28, 18), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4, roughness: 0.35, metalness: 0.1, transparent: true }));
    const label = makeLabel(`${esc(s.method)}<span class="sub">${esc(s.file)}:${s.line}</span>`, 'site');
    label.position.set(-1, 0, 0);
    addNode({ id: 's:' + s.id, mesh, color, glowScale: 4.5, label, pos: POS['s:' + s.id] });
    s.cells.forEach((c) => {
      const cc = new THREE.Color(STATE_COLORS[c.state]);
      const grey = c.state === 'unreached';
      const m = new THREE.Mesh(cellGeo, new THREE.MeshStandardMaterial({ color: cc, emissive: cc, emissiveIntensity: grey ? 0.1 : 0.55, roughness: 0.5, transparent: true }));
      addNode({ id: `c:${s.id}|${c.mode}`, mesh: m, color: cc, glowScale: grey ? 0 : 3.2, label: null, pos: POS[`c:${s.id}|${c.mode}`], baseOpacity: grey ? 0.55 : 1 });
    });
  });
  TESTS.forEach((t) => {
    const color = new THREE.Color(TEST_COLOR);
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.7, 24, 16), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4, transparent: true }));
    const label = makeLabel(esc(t.name), 'test');
    label.position.set(0, 0.6, 0);
    addNode({ id: 't:' + t.label, mesh, color, glowScale: 4, label, pos: POS['t:' + t.label] });
    t.sites.filter((id) => SITE[id]).forEach((id) => {
      const geo = new THREE.BufferGeometry().setFromPoints([POS['t:' + t.label], POS['s:' + id]]);
      const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.3 }));
      scene.add(line); edges.push({ a: 't:' + t.label, b: 's:' + id, line });
    });

  renderer.domElement.addEventListener('pointermove', onMove);
  renderer.domElement.addEventListener('click', onClick);
  addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight); });
}

/* ------------------------------------------------------------------ */
/* Camera                                                              */
/* ------------------------------------------------------------------ */
const sideWidths = () => ({
  left: !$('#index').classList.contains('closed') && innerWidth >= 900 ? 290 : 0,
  right: $('#panel').classList.contains('open') && innerWidth >= 900 ? $('#panel').offsetWidth : 0,
  footer: $('#tour').classList.contains('on') ? $('#tour').offsetHeight + 34 : 70,
});
function frame(ids, extra = 1.2) {
  const pts = ids.map((id) => POS[id]).filter(Boolean);
  if (!pts.length) return;
  const box = new THREE.Box3().setFromPoints(pts); const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()); const halfW = Math.max(size.x / 2, 5) * extra, halfH = Math.max(size.y / 2, 4) * extra;
  const { left, right, footer } = sideWidths(); const t = Math.tan((camera.fov * Math.PI) / 360);
  const freeW = Math.max(innerWidth - left - right - 160, 300), freeH = Math.max(innerHeight - 70 - footer - 90, 200);
  const dist = Math.max(halfH * innerHeight / (freeH * t), halfW * innerWidth / (freeW * t * camera.aspect)) + size.z / 2 + 6;
  const dir = V(0, 0.18, 1).normalize();
  camTween = { t: 0, fromPos: camera.position.clone(), fromTarget: controls.target.clone(), toTarget: center, toPos: center.clone().add(dir.multiplyScalar(dist)) };
}
let viewShift = 0, viewLift = 0;
function applyViewOffset(dt) {
  const { left, right, footer } = sideWidths(); const k = dt ? 1 - Math.pow(0.004, dt) : 1;
  viewShift += ((left - right) / 2 - viewShift) * k; viewLift += ((footer - 70) / 2 - viewLift) * k;
  camera.setViewOffset(innerWidth, innerHeight, -viewShift, viewLift, innerWidth, innerHeight); camera.updateProjectionMatrix();
  const rs = document.documentElement.style;
  rs.setProperty('--free-left', left + 'px'); rs.setProperty('--free-right', right + 'px');
  rs.setProperty('--mid', (left + (innerWidth - left - right) / 2) + 'px');
}
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const ALL_IDS = Object.keys(POS);

/* ------------------------------------------------------------------ */
/* Highlight and picking                                               */
/* ------------------------------------------------------------------ */
const cellIds = (site) => site.cells.map((c) => `c:${site.id}|${c.mode}`);
const testIds = (site) => site.tests.filter((l) => TEST[l]).map((l) => 't:' + l);
/** Everything that belongs with one thing: a site with its cells, tests and wrapper; a test with its sites; a wrapper with all of it. */
const NEIGHBOURS = {
  s: (key) => { const s = SITE[key]; return ['s:' + key, 'w:' + s.wrapper, ...cellIds(s), ...testIds(s)]; },
  c: (key) => { const [siteId, mode] = key.split('|'); const s = SITE[siteId]; return ['c:' + key, 's:' + siteId, 'w:' + s.wrapper, ...testIds(s), ...cellIds(s)]; },
  t: (key) => { const t = TEST[key]; return ['t:' + key, ...t.sites.filter((id) => SITE[id]).flatMap((id) => ['s:' + id, ...cellIds(SITE[id])])]; },
  w: (key) => ['w:' + key, ...wrapperSites(key).flatMap((s) => ['s:' + s.id, ...cellIds(s), ...testIds(s)])],
};
const neighbourhood = (id) => new Set(NEIGHBOURS[id[0]](id.slice(2)));
const raycaster = new THREE.Raycaster();
function pickAt(e) {

  raycaster.setFromCamera(m, camera);

  const hit = raycaster.intersectObjects(meshes, false)[0];

}
const nameOf = (id) => ({ s: (k) => `${SITE[k].wrapper}.${SITE[k].method}`, c: (k) => { const [siteId, mode] = k.split('|'); return `${SITE[siteId].method} under ${mode}`; }, t: (k) => TEST[k].name, w: (k) => k })[id[0]](id.slice(2));
const tipOf = (id) => ({
  s: (k) => `${SITE[k].file}:${SITE[k].line} · ${countsText(SITE[k].cells)}`,
  c: (k) => { const [siteId, mode] = k.split('|'); return SITE[siteId].cells.find((c) => c.mode === mode).note; },
  t: (k) => `${TEST[k].file} · reaches ${plural(TEST[k].sites.length, 'call site')}`,
  w: (k) => countsText(wrapperSites(k).flatMap((s) => s.cells)),
})[id[0]](id.slice(2));

  tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 14, innerWidth - 350) + 'px'; tip.style.top = (e.clientY + 14) + 'px';

function hover(id) {

function onClick(e) { const id = pickAt(e); if (id) onPick(id); else { setHighlight(null); closePanel(); } }
/** A click on anything: the panel for it, the things around it lit, and the walkthrough put aside. */

/* ------------------------------------------------------------------ */
/* Panel                                                               */
/* ------------------------------------------------------------------ */
function openPanel() { $('#panel').classList.add('open'); if (innerWidth < 900) $('#index').classList.add('closed'); }
function closePanel() { $('#panel').classList.remove('open'); }
function wirePanel() {

}
const sq = (state) => `<span class="sq" style="background:${STATE_COLORS[state]}"></span>`;

const testChip = (label) => `<button class="chip" data-go="t:${esc(label)}"><span class="sw" style="background:${TEST_COLOR}"></span>${esc(label)}</button>`;
const checkChip = (name) => `<span class="chip check">⚠ ${esc(name)}</span>`;

  $('#panelHead').innerHTML = `<button class="iconbtn close" id="closeP">✕</button><div class="kind"><span class="sw" style="background:${wrapperColor(s.wrapper)}"></span>Call site · ${esc(s.wrapper)}</div><h2>${esc(s.wrapper)}.${esc(s.method)}</h2><p class="simple"><a href="${esc(editorUrl(s))}" title="Open in VS Code"><span class="code">${esc(s.file)}:${s.line}</span></a> · a ${esc(s.kind)}${s.checks.length ? ` · ${plural(s.checks.length, 'check')} fired` : ''}</p>`;
  $('#panelBody').innerHTML = `${noticeBlock()}${s.checks.length ? `<h3>Static checks that fired</h3><div class="chips">${s.checks.map(checkChip).join('')}</div>` : ''}
    <h3>Tests that reach it</h3>${tests}

  $('#panelBody').innerHTML = `<h3>Call sites it reaches</h3><div class="chips">${sites.map(siteChip).join('')}</div>
    <p style="margin-top:12px">Each beam in the scene runs from this test to a call site it reached in the traced baseline run. With a failure injected at that site, this is one of the tests that runs.</p>`;

}

  $('#panelBody').innerHTML = `${noticeBlock()}<h3>Call sites, worst first</h3><div class="chips">${[...sites].sort((a, b) => STATE_ORDER.indexOf(siteWorst(a)) - STATE_ORDER.indexOf(siteWorst(b))).map(siteChip).join('')}</div>`;

const SHOW = { s: (k) => showSite(k), c: (k) => { const [siteId, mode] = k.split('|'); showSite(siteId, mode); }, t: (k) => showTest(k), w: (k) => showWrapper(k) };
/** What to frame when something is chosen from the panel or the index. */
const goFrame = (id) => ({ s: (k) => ['s:' + k, ...cellIds(SITE[k])], c: (k) => ['s:' + k.split('|')[0], ...cellIds(SITE[k.split('|')[0]])], t: (k) => ['t:' + k, ...TEST[k].sites.filter((x) => SITE[x]).map((x) => 's:' + x)], w: (k) => NEIGHBOURS.w(k).filter((x) => !x.startsWith('t:')) })[id[0]](id.slice(2));

  $('#panelBody').innerHTML = `${noticeBlock()}<h3>What the colours mean</h3>${legendList()}<h3>Another way in</h3><div class="dcard" data-way="explore"><div class="t">Explore on your own</div><div class="w">Turn, pan and zoom the whole picture. Click any wrapper, call site, cell or test for its details.</div></div>`;
  openPanel(); wirePanel();
  document.querySelectorAll('#panelBody [data-way]').forEach((el) => (el.onclick = () => { pauseTour({ offerReturn: false }); setView('explore'); }));

/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */

  const q = filter.trim().toLowerCase();
  const match = (s) => !q || s.toLowerCase().includes(q);
  const blocks = WRAPPERS.map((w) => {
    const sites = wrapperSites(w.name).filter((s) => match(`${s.wrapper}.${s.method} ${s.file}`));
    if (!sites.length && !match(w.name)) return '';
    return `<button class="item" data-go="w:${esc(w.name)}"><span class="sw" style="background:${wrapperColor(w.name)}"></span><span class="name">${esc(w.name)}</span><span class="count">${w.sites.length}</span></button>` +
      sites.map((s) => `<button class="item l1" data-go="s:${esc(s.id)}" title="${esc(s.file)}:${s.line}"><span class="sq" style="background:${STATE_COLORS[siteWorst(s)]}"></span><span class="name">${esc(s.method)} <span style="color:var(--faint)">${esc(s.file)}:${s.line}</span></span></button>`).join('');
  }).join('');
  const tests = TESTS.filter((t) => match(t.label)).map((t) => `<button class="item l1" data-go="t:${esc(t.label)}" title="${esc(t.label)}"><span class="sw" style="background:${TEST_COLOR}"></span><span class="name">${esc(t.name)}</span><span class="count">${t.sites.length}</span></button>`).join('');
  $('#indexList').innerHTML = `<div class="sec">Wrappers and call sites</div>${blocks || '<p class="item">Nothing matches.</p>'}<div class="sec">Tests that reach a call site</div>${tests || `<p class="item">${TESTS.length ? 'Nothing matches.' : 'None yet.'}</p>`}`;
  document.querySelectorAll('#indexList [data-go]').forEach((el) => (el.onclick = () => { onPick(el.dataset.go); frame(goFrame(el.dataset.go)); }));
  markIndex();
}
function markIndex() { document.querySelectorAll('#indexList [data-go]').forEach((el) => el.classList.toggle('on', el.dataset.go === view.focus)); }

/* ------------------------------------------------------------------ */
/* Views                                                               */
/* ------------------------------------------------------------------ */
function setView(name) {
  view.name = name; closePanel(); setHighlight(null); frame(ALL_IDS, 1.1); markTourTab();
}

/* ------------------------------------------------------------------ */
/* The walkthrough                                                     */
/* ------------------------------------------------------------------ */
/** Every step of the tour, in order, built from the data: the big picture, each wrapper, then every uncovered cell. */
function buildTour() {
  const steps = [];
  const add = (chapter, step) => steps.push({ chapter, ...step });
  const big = 'The big picture';
  const uncoveredCells = SITES.flatMap((s) => s.cells.filter((c) => c.state !== 'coped').map((c) => ({ s, c })));
  add(big, { kind: 'start', say: `This is the failure map of ${PROJECT}.`,
    more: `${SCENE.headline ? SCENE.headline + ' ' : ''}Each wrapper module is a group. Each call into it is a node, placed by file. Each test that reaches a call is a beam. Each failure mode is a column, so a call site is a row of cells. Press Next, or the → key, to go on. The menu above jumps to any chapter.` });
  add(big, { kind: 'colours', say: 'Green means the code coped. Red, amber and grey are the point.',
    more: `Red: the failure was injected and nothing caught it. Amber: the tests passed, but a static check found a pattern that passing hides. Grey: no test reaches the call, so nobody has walked that path. ${uncoveredCells.length ? `${plural(uncoveredCells.length, 'cell')} of ${SITES.length * MODES.length} need a look.` : 'Every cell here is green.'}` });
  WRAPPERS.forEach((w, i) => {
    const sites = wrapperSites(w.name); const cells = sites.flatMap((s) => s.cells);
    add(`${i + 1}. ${w.name}`, { kind: 'wrapper', id: w.name, say: `Wrapper ${i + 1} of ${WRAPPERS.length}: ${w.name}`,
      more: `${plural(sites.length, 'call site')} in ${plural(wrapperFiles(w.name).length, 'file')}, ${cells.length} cells: ${countsText(cells)}.` });
  });
  const gap = 'Uncovered failure paths';
  if (SCENE.status !== 'run') {
    add(gap, { kind: 'notice', say: 'Every cell is grey, because no run has filled it yet.', more: SCENE.notice });
  }
  const reds = uncoveredCells.filter(({ c }) => c.state === 'uncaught');
  const ambers = uncoveredCells.filter(({ c }) => c.state === 'risk');
  reds.forEach(({ s, c }, i) => add(gap, { kind: 'cell', id: `${s.id}|${c.mode}`, state: 'uncaught', say: `Uncaught ${i + 1} of ${reds.length}: ${s.wrapper}.${s.method} under ${c.mode}, at ${s.file}:${s.line}.`,
    more: `When ${modeText(c.mode)}, ${verdictText(c.verdict)}. ${c.note}` }));
  ambers.forEach(({ s, c }, i) => add(gap, { kind: 'cell', id: `${s.id}|${c.mode}`, state: 'risk', say: `Risk ${i + 1} of ${ambers.length}: ${s.wrapper}.${s.method} under ${c.mode}, at ${s.file}:${s.line}.`,
    more: `When ${modeText(c.mode)}, ${verdictText(c.verdict)}. ${c.note}` }));
  const greys = SITES.filter((s) => s.cells.some((c) => c.state === 'unreached'));
  greys.forEach((s, i) => add(gap, { kind: 'site', id: s.id, state: 'unreached', say: `Nobody walks ${s.wrapper}.${s.method} at ${s.file}:${s.line}${greys.length > 1 ? ` (${i + 1} of ${greys.length})` : ''}.`,
    more: s.tests.length ? `${plural(s.tests.length, 'test')} reach it, but ${s.cells.filter((c) => c.state === 'unreached').length} of its ${MODES.length} cells have no verdict yet. ${s.cells.find((c) => c.state === 'unreached').note}` : `No test reaches this call site, so none of the ${MODES.length} failure modes has been tried here. A failure at this line goes straight to production untested.` }));
  if (SCENE.status === 'run' && !uncoveredCells.length) add(gap, { kind: 'notice', say: 'Every cell is green.', more: 'Every call site is reached by a test, and the code coped with every failure mode injected. There is nothing uncovered to show.' });
  add('The end', { kind: 'end', say: 'That is every failure path.', more: 'Red and amber cells name the exact file and line to fix. Grey sites need a test that reaches them. Explore, in the top bar, is the way back in any time.' });
  return steps;
}
const TOUR = buildTour();
const TOUR_CHAPTERS = TOUR.map((s) => s.chapter).filter((c, i, all) => all.indexOf(c) === i);
/** Lights up what a step is about and frames it. */
function tourShow(highlightId, ids, extra = 1.2) {
  view.highlight = highlightId ? neighbourhood(highlightId) : null; view.focus = highlightId; markIndex();
  frame(ids, extra);
}
/** What the map does at each kind of step. */
const TOUR_SHOW = {
  start: () => { tourShow(null, ALL_IDS, 1.1); renderWaysInPanel('The whole picture', `${plural(WRAPPERS.length, 'wrapper')}, ${plural(SITES.length, 'call site')}, ${plural(MODES.length, 'failure mode')}, ${plural(TESTS.length, 'test')} that reach a call site.`); },
  colours: () => { tourShow(null, ALL_IDS, 1.1); renderWaysInPanel('What the colours mean', 'Every cell is one call site under one failure mode.'); },
  wrapper: (s) => { tourShow('w:' + s.id, goFrame('w:' + s.id), 1.25); showWrapper(s.id); },
  notice: () => { tourShow(null, ALL_IDS, 1.1); renderWaysInPanel('Nothing has run yet', SCENE.notice); },
  cell: (s) => { tourShow('c:' + s.id, goFrame('c:' + s.id), 1.6); const [siteId, mode] = s.id.split('|'); showSite(siteId, mode); },
  site: (s) => { tourShow('s:' + s.id, goFrame('s:' + s.id), 1.6); showSite(s.id); },
  end: () => { tourShow(null, ALL_IDS, 1.1); renderWaysInPanel('That is every failure path', 'Every wrapper, every call site, every mode, and who walks each.'); },
};
function showTourStep(i) {
  tour.step = Math.max(0, Math.min(i, TOUR.length - 1));
  const s = TOUR[tour.step];
  tour.isSteering = true;
  try { TOUR_SHOW[s.kind](s); } finally { tour.isSteering = false; }
  markTourTab();
  $('#tourTag').className = `tourtag ${s.state || ''}`; $('#tourTag').textContent = s.state ? STATE_NAMES[s.state] : '';
  $('#tourChapter').value = s.chapter;
  $('#tourSay').textContent = s.say; $('#tourMore').textContent = s.more;
  $('#tourNum').textContent = `Step ${tour.step + 1} of ${TOUR.length}`;
  $('#tourBar').style.width = `${((tour.step + 1) / TOUR.length) * 100}%`;
  /* No Back on the first step and no Next on the last. */
  $('#tourPrev').hidden = tour.step === 0;
  $('#tourNext').hidden = tour.step === TOUR.length - 1;
}
const toTourLabel = () => {
  if (tour.step === 0) return 'Walk me through everything';
  if (tour.step === TOUR.length - 1) return 'Walk me through everything again';
  return `Continue the walkthrough (step ${tour.step + 1} of ${TOUR.length})`;
};
function markTourTab() {
  const active = tour.isOn ? 'tour' : view.name;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.view === active));
  if ($('#startTourLabel')) $('#startTourLabel').textContent = toTourLabel();
}
function startTour() {
  $('#intro').classList.add('gone');
  $('#tourResume').hidden = true;
  if (!tour.isOn && tour.step === TOUR.length - 1) tour.step = 0;
  tour.isOn = true;
  $('#tour').classList.add('on'); document.body.classList.add('touring');
  showTourStep(tour.step);
}
/** Puts the tour aside when the person goes their own way, keeping its place. Moves the tour makes itself don't count. */
function pauseTour({ offerReturn = true } = {}) {
  if (!tour.isOn || tour.isSteering) return;
  tour.isOn = false;
  $('#tour').classList.remove('on'); document.body.classList.remove('touring');
  $('#tourResumeStep').textContent = `step ${tour.step + 1} of ${TOUR.length}`;
  $('#tourResume').hidden = !offerReturn;
  markTourTab();
}
$('#tourChapter').innerHTML = TOUR_CHAPTERS.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
$('#tourChapter').onchange = (e) => showTourStep(TOUR.findIndex((s) => s.chapter === e.target.value));
$('#tourNext').onclick = () => showTourStep(tour.step + 1);
$('#tourPrev').onclick = () => showTourStep(tour.step - 1);
$('#tourExit').onclick = () => { pauseTour({ offerReturn: false }); setView('explore'); };
$('#tourResume').onclick = startTour;

/* ------------------------------------------------------------------ */
/* Render loop                                                         */
/* ------------------------------------------------------------------ */
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  Object.values(nodes).forEach((n) => {
    const lit = !view.highlight || view.highlight.has(n.id);
    const goal = n.baseOpacity * (lit ? 1 : 0.12);
    n.opacity += (goal - n.opacity) * (1 - Math.pow(0.002, dt));
    n.scale += (n.targetScale - n.scale) * 0.2;
    n.group.scale.setScalar(n.scale);
    if (n.id.startsWith('w:')) n.mesh.rotation.y += dt * 0.25;
    n.mesh.material.opacity = n.opacity; n.glow.material.opacity = n.opacity * 0.5;
    /* A test's label shows only while the test is lit by a selection or hovered: many tests share the row, and their names are long. */
    const quiet = n.id.startsWith('t:') && !(view.highlight && lit) && view.hover !== n.id;
    if (n.label) { n.label.element.style.opacity = n.opacity > 0.3 && !quiet ? (lit ? 1 : 0.25) : 0; n.label.inner.style.pointerEvents = lit && !quiet ? 'auto' : 'none'; }
  });
  edges.forEach((e) => {
    const both = !view.highlight || (view.highlight.has(e.a) && view.highlight.has(e.b));
    const goal = view.highlight ? (both ? 0.9 : 0.04) : 0.3;
    e.line.material.opacity += (goal - e.line.material.opacity) * (1 - Math.pow(0.002, dt));
  });
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt / 0.7); const k = ease(camTween.t);
    camera.position.lerpVectors(camTween.fromPos, camTween.toPos, k); controls.target.lerpVectors(camTween.fromTarget, camTween.toTarget, k);
    if (camTween.t >= 1) camTween = null;
  }
  applyViewOffset(dt); controls.update();
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* ------------------------------------------------------------------ */
/* Chrome and the greeting                                             */
/* ------------------------------------------------------------------ */
function renderChrome() {
  $('#brand').innerHTML = `failwalk map <small>${esc(PROJECT)}</small>`;
  $('#built').textContent = SCENE.generatedAt ? `data from ${new Date(SCENE.generatedAt).toLocaleString()}` : 'inventory only';
  $('#legend').innerHTML = STATE_ORDER.map((s) => `<span><i style="background:${STATE_COLORS[s]}"></i>${esc(STATE_NAMES[s])}</span>`).join('') + `<span><i class="round" style="background:${TEST_COLOR}"></i>Test</span><span><i style="background:#7dd3fc;height:2px"></i>Reaches</span>`;
  const uncovered = SITES.flatMap((s) => s.cells).filter((c) => c.state !== 'coped').length;
  $('#introCard').innerHTML = `<h1>failwalk map<small>${esc(PROJECT)}</small></h1>
    <p>Every place the code calls a vendor or a database through a wrapper module, against every failure mode. Green cells coped. Red cells were injected and nothing caught them. Amber cells passed while hiding a risky pattern. Grey cells were never walked by any test.</p>
    <div class="row"><div><b>${SITES.length}</b>${SITES.length === 1 ? 'call site' : 'call sites'} in ${plural(WRAPPERS.length, 'wrapper')}</div><div><b>${TESTS.length}</b>${TESTS.length === 1 ? 'test reaches' : 'tests reach'} a call site</div><div><b>${uncovered}</b>of ${SITES.length * MODES.length} cells uncovered</div></div>
    ${SCENE.notice ? `<div class="callout warn">${esc(SCENE.notice)}</div>` : ''}
    <p class="ask">Would you like to walk through everything or explore on your own?</p>
    <div class="choices"><button class="choice primary" id="startTour"><b id="startTourLabel">${esc(toTourLabel())}</b><span>The big picture, then each wrapper, then every uncovered cell, one at a time, with Back and Next.</span></button>
    <button class="choice" id="startExplore"><b>Explore on my own</b><span>Turn, pan and zoom. Click any wrapper, call site, cell or test for its file, line, tests and verdicts.</span></button></div>`;
  $('#startTour').onclick = startTour;
  $('#startExplore').onclick = () => { $('#intro').classList.add('gone'); setView('explore'); };
}
document.querySelectorAll('.tab').forEach((t) => (t.onclick = () => (t.dataset.view === 'tour' ? startTour() : (pauseTour({ offerReturn: true }), setView('explore')))));
$('#search').addEventListener('input', (e) => buildIndex(e.target.value));
$('#toggleIndex').onclick = () => { $('#index').classList.toggle('closed'); if (innerWidth < 900 && !$('#index').classList.contains('closed')) closePanel(); };
$('#helpBtn').onclick = () => $('#intro').classList.remove('gone');
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if (tour.isOn && e.key === 'ArrowRight') { $('#tourNext').click(); return; }
  if (tour.isOn && e.key === 'ArrowLeft') { $('#tourPrev').click(); return; }
  if (e.key === 'Escape') { if (!$('#intro').classList.contains('gone')) $('#intro').classList.add('gone'); else { closePanel(); setHighlight(null); } }
});
if (innerWidth < 900) $('#index').classList.add('closed');

renderChrome(); buildIndex();
if (gl) {
  initScene(); frame(ALL_IDS, 1.1); tick();
} else {
  $('#nogl').style.display = 'grid';
  window.frame = () => {};
}
/* For a headless check or a script: the page's data and the walkthrough, read-only. */
window.__failwalk = { scene: SCENE, tour: TOUR, go: showTourStep, start: startTour };
</script>
</body>
</html>

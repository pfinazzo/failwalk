# claimcheck claims file for failwalk v1-simple-run: `failwalk init`, the bare `failwalk` command, the install path and
# the README about running it. One entry per thing the author asserts about this diff. The diff is against main.
# Product-code files in the diff: src/cli.ts, src/index.ts, src/version.ts, src/init/*.ts, src/run/simpleRun.ts,
# src/run/runCommand.ts, package.json, scripts/prepare.js, examples/sample-api/{jest.failwalk.config.js,failwalk.config.json,package.json,.gitignore}.
version: 1
author: "claude-code/claude-fable-5-1"
base: "main"
claims:
  - id: c1
    claim: "src/init/wrapperFolders.ts exports WRAPPER_FOLDERS as exactly config, src/config, lib/config, clients, src/clients, services, src/services, wrappers, src/wrappers in that order, and pickWrapperFolder({ root }) returns the first of them that is a directory under root with the glob `<folder>/**/*.{js,ts}`, or null when none is; initProject uses it only when --wrappers was not given, and its first printed line names the folder and says it is the first folder of the list that exists here"
    confidence: 0.95
    criteria: [1]
    files: ["src/init/wrapperFolders.ts", "src/init/initProject.ts"]
    kill_condition: "test: tests/init.test.ts::takes the first folder of the lookup list that exists, and prints which one and why"
    verified_by:
      - "cmd: npx vitest run tests/init.test.ts"
      - "obs: in examples/sample-api, init printed `wrappers: config/**/*.{js,ts} (config is the first folder of config, src/config, ... that exists here; pass --wrappers to choose another)`"

  - id: c2
    claim: "When --wrappers is not given and no folder of WRAPPER_FOLDERS exists under the root, `failwalk init` exits 1 with one stderr line that starts `failwalk: no wrapper folder found in <root>`, lists the folders it looked for, and ends `Pass --wrappers <glob> to say where your wrapper modules are.`, and neither failwalk.config.json nor jest.failwalk.config.js is written"
    confidence: 0.95
    criteria: [1]
    files: ["src/init/initProject.ts", "src/cli.ts"]
    kill_condition: "test: tests/init.test.ts::exits 1 naming --wrappers when no folder of the list exists, and writes nothing"
    verified_by:
      - "cmd: npx vitest run tests/init.test.ts"

  - id: c3
    claim: "`failwalk init` writes failwalk.config.json as a two-key JSON object { wrappers: <glob>, jestConfig: \"jest.failwalk.config.js\" } with two-space indentation and a trailing newline, and readConfig({ root }) in src/init/config.ts returns that object or null when the file is missing"
    confidence: 0.96
    criteria: [1, 4]
    files: ["src/init/config.ts", "src/init/initProject.ts"]
    kill_condition: "test: tests/init.test.ts::--wrappers wins over the lookup"
    verified_by:

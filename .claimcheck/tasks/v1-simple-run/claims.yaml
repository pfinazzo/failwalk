    claim: "The override's setupFile() reads process.env.FAILWALK_SETUP first, else require.resolve(\"failwalk/dist/tracer/setup.js\"), else throws an Error naming failwalk; the text contains no absolute path and no __dirname; runnerEnv (unchanged) sets FAILWALK_SETUP to the built setup file for the baseline and every cell, which is how the bare command and `failwalk run` reach the setup file from a global or npx install"

      - "cmd: npx -y github:pfinazzo/failwalk#v1-simple-run --version (0.1.0, 9 s)"
      - "cmd: in a fresh clone without node_modules, npm_config_global=true node scripts/prepare.js installed the dev dependencies and built dist"
      - "cmd: npm pack github:pfinazzo/failwalk#v1-simple-run && npm install -g ./failwalk-0.1.0.tgz && failwalk --version (0.1.0)"
      - "cmd: npm install -g github:pfinazzo/failwalk#v1-simple-run (fails: ENOENT chmod under lib/node_modules/failwalk on npm 10.9.8 and 11.19.0; ENOTDIR rename on a retry)"

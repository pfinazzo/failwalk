  - id: c10
    claim: "The greeting (src/ui/page/loop.js) shows one chip per service, `complete` in green, `<n> gaps` in red, or `not walked yet` before a run, a `<done> of <all> services fully walked` count, a since-you-last-looked line when the browser saw an earlier run of this root, and asks `Would you like to walk through everything or explore on your own?`; buildTour in src/ui/page/tour.js makes, in order, a start step naming how many services are fully walked, a colours step, one step per wrapper, a `Closed since last time` chapter with one step per cell that was not coped in the saved run and is coped now, then under `Uncovered failure paths` a notice step when the status is not run, one step per uncaught cell, one per risk cell, one per site with any grey cell (each gap step carrying gapIndex and gapTotal for the `Gap N of M` count), a single all-green step when a run has nothing uncovered, and an end step; the player has Back, Next, a chapter select, a progress bar, the running count and Exit; ArrowRight and ArrowLeft move it; Back is hidden on step 1 and Next on the last; onPick calls pauseTour, which shows `Back to the walkthrough · step N of M` unless the tour itself made the move"

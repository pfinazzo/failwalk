    confidence: 0.9
    criteria: [6]
    files: ["src/ui/template.html"]
    kill_condition: "obs: open docs/failwalk-ui-explore.jpg; three wrapper groups, call sites under file labels, beams from the tests, and a coloured row per site are visible, with the legend at the bottom"
    verified_by:

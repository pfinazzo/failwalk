  - id: c10
    claim: "The greeting card asks `Would you like to walk through everything or explore on your own?` with two buttons; buildTour makes, in order, a start step, a colours step, one step per wrapper, then under `Uncovered failure paths` a notice step when the status is not run, one step per uncaught cell, one per risk cell, one per site with any grey cell, a single all-green step when a run has nothing uncovered, and an end step; the player has Back, Next, a chapter select, a progress bar and Exit; ArrowRight and ArrowLeft move it; Back is hidden on step 1 and Next on the last; onPick calls pauseTour, which shows `Back to the walkthrough · step N of M` unless the tour itself made the move (isSteering); Explore frames the whole board and opens the panel on click"

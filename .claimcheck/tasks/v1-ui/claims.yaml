  - id: c9
    claim: "Clicking a call-site sphere, its label, or an index entry calls showSite, whose panel head shows the wrapper, the wrapper.method, the file:line as a vscode:// link and the kind, and whose body shows the fired checks as chips, the tests that reach it as chips (or a sentence that none does), and one row per mode with its colour square, the mode, the state name and the note; clicking a cell opens the same panel with that mode's row marked; clicking a test sphere lists the sites it reaches; clicking a wrapper lists its sites sorted worst state first with a counts sentence; picking is a Raycaster over every node mesh"

  - id: c9
    claim: "In src/ui/page/panels.js, clicking a call-site sphere, its label, or an index entry calls showSite, whose head shows the wrapper, the wrapper.method, the file:line and the kind, and whose body shows the fired checks as chips, the tests that reach it as chips (or a sentence that none does), and one row per mode with its colour square, the mode, the state name, the note and the production sentence; clicking a cell opens the same panel with that mode's row marked; clicking a test sphere lists the sites it reaches; clicking a wrapper shows a callout saying it is complete, how many gaps it has, or that nothing is walked yet, then its sites sorted worst state first; picking (scene.js) is a Raycaster over every node mesh"

# claimcheck claims file for failwalk v1, the map: failwalk ui draws the grid as a self-contained 3D page.
# One entry per thing the author asserts about this diff. The diff is against main.
# The page's script (src/ui/page/*.js) runs only in a browser, so no planted bug in it is caught by npm test; those claims are
# checked by the headless-browser run named in each one, and their catch rate is expected to be 0.
version: 1
author: "claude-code/claude-fable-5-1"
base: "main"
claims:
  - id: c1
    claim: "src/cli.ts registers a `ui` command with --inventory (default from inventoryPath, so FAILWALK_INVENTORY is honoured), --trace (default failwalk-trace.json), --report (default failwalk.json), --out (default failwalk-ui.html) and --no-open; runUi resolves the three input paths, calls loadScene, writes renderPage's output to --out, prints `failwalk ui: <sites> call sites, <modes> modes, <tests> tests. written to <absolute out>` and the scene's notice when there is one to stderr, and calls openInBrowser unless --no-open was given"
    confidence: 0.94
    criteria: [1]
    files: ["src/cli.ts"]
    kill_condition: "test: tests/ui.test.ts::writes the page from the sample app's inventory alone, grey everywhere, and says what to run"
    verified_by:
      - "cmd: npm run test:tool"
      - "obs: ran node dist/cli.js ui --no-open in a folder holding the sample run's files and in one holding only an inventory; both printed the written-to line, the second printed the notice"

  - id: c2
    claim: "loadScene in src/ui/load.ts reads the inventory through loadInventory and lets its error through uncaught, so a missing inventory file ends the command with the message loadInventory raises, which the CLI test checks names the path and says to run failwalk inventory; it reads failwalk-trace.json and failwalk.json only when they exist, falls back to the trace kept inside failwalk.json when the trace file is missing but the report is there, and hands the three to shapeScene; openInBrowser picks the opener from a table keyed by platform (darwin: open, win32: cmd /c start, linux: xdg-open, anything else treated as linux) and spawns it detached and unref'd"
    confidence: 0.9
    criteria: [1]
    files: ["src/ui/load.ts"]
    kill_condition: "test: tests/ui.test.ts::names the inventory file when it is missing and says to run failwalk inventory"
    verified_by:
      - "cmd: npm run test:tool"
      - "obs: node dist/cli.js ui (without --no-open) on this Mac opened the page in the default browser"

  - id: c3
    claim: "renderPage in src/ui/render.ts reads dist/ui/template.html, dist/ui/page.css and the five parts dist/ui/page/{data,scene,panels,tour,loop}.js (all copied from src/ui by the build script in package.json, which copies everything under src/ui except .ts files), replaces __TITLE__ with `failwalk map · <root basename>` HTML-escaped, __STYLE__ with the stylesheet, __SCRIPT__ with the parts joined in that order, and __FAILWALK_DATA__ with the scene as JSON in which every `<` is written as \\u003c, so no test name or path can close the script block; every replacement takes a function so a `$` in the page's code is never read as a pattern; the template's only outside resource is Three.js 0.160.0 from cdn.jsdelivr.net through an import map (no stylesheet link, no script src, a data: favicon), so the written page needs no other file on disk"
    confidence: 0.93
    criteria: [2]
    files: ["src/ui/render.ts", "src/ui/template.html", "package.json"]
    kill_condition: "test: tests/ui.test.ts::puts the scene into the template as JSON that cannot close the script block, and pins Three.js to one version"
    verified_by:
      - "cmd: npm run test:tool"
      - "cmd: grep -c 'three@0.160.0' src/ui/template.html (2, the two import map entries); grep -c '<script[^>]*src=\\|fonts.googleapis' src/ui/template.html (0)"

  - id: c4
    claim: "src/ui/page/scene.js sets up OrbitControls with damping, zoomToCursor and a 2.5 zoom speed, so the camera orbits on left-drag, pans on right-drag or a modifier-drag, and zooms on scroll; the renderer clears to #070b14 and page.css uses the system map's dark tokens; frame() moves the camera with a 0.7 s eased tween, or jumps at once when the person asked for reduced motion; a browser without WebGL sees the #nogl notice (src/ui/page/loop.js) while the index and panel keep working"
    confidence: 0.88
    criteria: [2]
    files: ["src/ui/page/scene.js", "src/ui/page.css"]
    kill_condition: "obs: open the page in a browser, drag, right-drag and scroll; the board turns, slides and grows"
    verified_by:
      - "obs: opened the sample run's page in headless Chromium through playwright-cli and in the desktop app's browser pane; the board drew on a dark background and responded to drag and scroll"

  - id: c5
    claim: "shapeScene in src/ui/shape.ts is pure and returns modes (the report's plan.modes copied when there is a report, else MODE_NAMES), wrappers (one per distinct wrapper name in inventory order, with its site ids, `gaps` = its cells that are not coped, and `complete` true only when the status is run and gaps is 0), sites (one per inventory record in inventory order, with id, file, line, wrapper, method, kind, checks defaulting to [], the sorted labels of the tests that reach it, and one cell per mode), tests (one per trace test with at least one site, labelled `<file relative to root> › <name>` the way mergeTraces labels them, with file, name and site ids), status (run when a report is given, traced when only a trace is, else inventory-only) and notice from NOTICE_BY_STATUS (empty for run); it mutates none of its inputs"
    confidence: 0.94
    criteria: [3]
    files: ["src/ui/shape.ts", "src/index.ts"]
    kill_condition: "test: tests/ui.test.ts::a wrapper earns complete only after a run in which every cell coped"
    verified_by:
      - "cmd: npm run test:tool"

  - id: c6
    claim: "STATE_BY_VERDICT in src/ui/shape.ts is exactly { PASS: coped, FAIL: coped, CRASH: uncaught, HANG: uncaught, RISK: risk, UNREACHED: unreached }; toCell reads it with `|| \"unreached\"`, so a verdict outside the table (such as MOCKED) is grey; a cell the report does not hold, which covers every cell when there is no report and a site the plan never listed, is grey with a null verdict; no state is chosen by an if/else ladder"
    confidence: 0.95
    criteria: [4]
    files: ["src/ui/shape.ts"]
    kill_condition: "test: tests/ui.test.ts::colours every verdict from the one lookup, and a verdict it does not know grey"
    verified_by:
      - "cmd: npm run test:tool"
      - "cmd: grep -n 'else' src/ui/shape.ts (no matches)"

  - id: c7
    claim: "Each cell's note is one line: for a cell that ran, the verdict, `fired <n> time(s)`, `checks: <names>` only for a RISK with checks, and the first line of the first non-passed test's message (or the first runner error) cut to 120 characters, joined by `; `; for a grey cell, a sentence from GREY_NOTES keyed by status; and each cell's `production` comes from productionText, one table keyed by verdict (PASS, FAIL, CRASH, HANG, RISK, UNREACHED) with a second sentence for CRASH and HANG on a write, RISK joining one sentence per fired check from PRODUCTION_BY_CHECK (a generic sentence for a check it does not name), a null verdict reading as UNREACHED, and an unknown verdict giving the treat-it-as-unwalked sentence"
    confidence: 0.93
    criteria: [5]
    files: ["src/ui/shape.ts"]
    kill_condition: "test: tests/ui.test.ts::says what goes wrong in production for each verdict, with a second sentence for writes"
    verified_by:
      - "cmd: npm run test:tool"

  - id: c8
    claim: "src/ui/page/data.js lays out each wrapper as a block along x (a wrapper node above, its sites stacked downwards under a halo label naming each file, each site's cells to its right one per mode under rotated mode labels) and each test behind the board at z -22 or further; src/ui/page/scene.js draws a wrapper as an icosahedron with a green torus ring and a `✓ complete` badge when it is complete, a red breathing glow and a `<n> gaps` badge when a run left gaps, a site as a sphere, a cell as a box coloured from STATE_COLORS by state with red and amber cells pulsing (`pulse: 'cell'`), grey cells at 0.7 opacity with a bright EdgesGeometry outline, and one THREE.Line beam from each test to every site it reaches; the legend in loop.js names the four states, the complete ring, the test dot and the beam"
    confidence: 0.9
    criteria: [6]

# claimcheck claims file for failwalk v1, the map: failwalk ui draws the grid as a self-contained 3D page.
# One entry per thing the author asserts about this diff. The diff is against main.
version: 1
author: "claude-code/claude-fable-5-1"
base: "main"
claims:
  - id: c1
    claim: "src/cli.ts registers a `ui` command with --inventory (default from inventoryPath, so FAILWALK_INVENTORY is honoured), --trace (default failwalk-trace.json), --report (default failwalk.json), --out (default failwalk-ui.html) and --no-open; runUi resolves the three input paths, calls loadScene, writes renderPage's output to --out, prints `failwalk ui: <sites> call sites, <modes> modes, <tests> tests. written to <absolute out>` and the scene's notice when there is one to stderr, and calls openInBrowser unless --no-open was given"
    confidence: 0.94
    criteria: [1]
    files: ["src/cli.ts"]
    kill_condition: "test: tests/ui.test.ts::writes the page from the sample app's inventory alone, grey everywhere, and says what to run"
    verified_by:
      - "cmd: npm run test:tool"
      - "obs: ran node dist/cli.js ui --no-open in a folder holding the sample run's files and in one holding only an inventory; both printed the written-to line, the second printed the notice"

  - id: c2
    claim: "loadScene in src/ui/load.ts reads the inventory through loadInventory, which throws naming the path and saying to run failwalk inventory when the file is missing; reads failwalk-trace.json and failwalk.json only when they exist; falls back to the trace kept inside failwalk.json when the trace file is missing but the report is there; and hands the three to shapeScene. openInBrowser picks the opener from a table keyed by platform (darwin: open, win32: cmd /c start, linux: xdg-open, anything else treated as linux) and spawns it detached and unref'd"
    confidence: 0.9
    criteria: [1]
    files: ["src/ui/load.ts"]
    kill_condition: "test: tests/ui.test.ts::names the inventory file when it is missing and says to run failwalk inventory"
    verified_by:
      - "cmd: npm run test:tool"
      - "obs: node dist/cli.js ui (without --no-open) on this Mac opened the page in the default browser"

  - id: c3
    claim: "renderPage in src/ui/render.ts reads dist/ui/template.html (copied from src/ui/template.html by the build script in package.json), replaces __TITLE__ with `failwalk map · <root basename>` HTML-escaped, and replaces __FAILWALK_DATA__ with the scene as JSON in which every `<` is written as \\u003c, so no test name or path can close the script block; the template's only outside resources are the Google Fonts stylesheet and Three.js 0.160.0 from cdn.jsdelivr.net through an import map, with every other script and style inline, so the written page needs no other file on disk"
    confidence: 0.93
    criteria: [2]
    files: ["src/ui/render.ts", "src/ui/template.html", "package.json"]
    kill_condition: "test: tests/ui.test.ts::puts the scene into the template as JSON that cannot close the script block, and pins Three.js to one version"
    verified_by:
      - "cmd: npm run test:tool"
      - "cmd: grep -c 'three@0.160.0' src/ui/template.html (2, the two import map entries) and grep -c '<script[^>]*src=' src/ui/template.html (0)"

  - id: c4
    claim: "The page uses OrbitControls with damping, zoomToCursor and a 2.5 zoom speed, so the camera orbits on left-drag, pans on right-drag or a modifier-drag, and zooms on scroll; the theme is dark (background #070b14, the same tokens as the system map's template); a browser without WebGL sees the #nogl notice while the index and panel keep working"
    confidence: 0.88
    criteria: [2]
    files: ["src/ui/template.html"]
    kill_condition: "obs: open the page in a browser, drag, right-drag and scroll; the board turns, slides and grows"
    verified_by:
      - "obs: opened the sample run's page in headless Chromium through playwright-cli and in the desktop app's browser pane; the board drew on a dark background and responded to drag and scroll"

  - id: c5
    claim: "shapeScene in src/ui/shape.ts is pure and returns modes (the report's plan.modes copied when there is a report, else MODE_NAMES), wrappers (one per distinct wrapper name in inventory order with its site ids), sites (one per inventory record in inventory order, with id, file, line, wrapper, method, kind, checks defaulting to [], the sorted labels of the tests that reach it, and one cell per mode), tests (one per trace test with at least one site, labelled `<file relative to root> › <name>` the way mergeTraces labels them, with file, name and site ids), status (run when a report is given, traced when only a trace is, else inventory-only) and notice from NOTICE_BY_STATUS (empty for run); it mutates none of its inputs"
    confidence: 0.94
    criteria: [3]
    files: ["src/ui/shape.ts", "src/index.ts"]
    kill_condition: "test: tests/ui.test.ts::takes the columns from the report's plan and the rows from the inventory, in order"
    verified_by:
      - "cmd: npm run test:tool"

  - id: c6
    claim: "STATE_BY_VERDICT in src/ui/shape.ts is exactly { PASS: coped, FAIL: coped, CRASH: uncaught, HANG: uncaught, RISK: risk, UNREACHED: unreached }; toCell reads it with `|| \"unreached\"`, so a verdict outside the table (such as MOCKED) is grey; a cell the report does not hold, which covers every cell when there is no report and a site the plan never listed, is grey with a null verdict; no state is chosen by an if/else ladder"
    confidence: 0.95
    criteria: [4]
    files: ["src/ui/shape.ts"]
    kill_condition: "test: tests/ui.test.ts::colours every verdict from the one lookup, and a verdict it does not know grey"
    verified_by:
      - "cmd: npm run test:tool"
      - "cmd: grep -n 'else' src/ui/shape.ts (no matches)"

  - id: c7
    claim: "Each cell's note is one line: for a cell that ran, the verdict, `fired <n> time(s)`, `checks: <names>` only for a RISK with checks, and the first line of the first non-passed test's message (or the first runner error) cut to 120 characters, joined by `; `; for a grey cell, a sentence from GREY_NOTES keyed by status that says there is no trace yet, that n tests reach the site but no run has filled the cell, that no test reaches the site, or (after a run) that no test reaches it so nothing was injected"
    confidence: 0.93
    criteria: [5]
    files: ["src/ui/shape.ts"]
    kill_condition: "test: tests/ui.test.ts::keeps the site's checks and writes a note per cell: verdict, fired count, checks and the first failure line"
    verified_by:
      - "cmd: npm run test:tool"

  - id: c8

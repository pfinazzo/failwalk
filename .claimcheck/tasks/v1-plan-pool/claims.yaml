# claimcheck claims file for failwalk v1 step 4: the plan, the bounded pool, and a verdict for every cell.
# One entry per thing the author asserts about this diff. The diff is against v1-inventory-tracer.
version: 1
author: "claude-code/claude-fable-5-1"
base: "v1-inventory-tracer"
claims:

# claimcheck configuration — written by `claimcheck init`, edit freely.
version = 1
base = "main"
# "tasks": each task keeps its spec, claims and ledger in .claimcheck/tasks/<branch>/, so two
# pull requests never change the same claimcheck file. "single": one set for the whole repo.
layout = "tasks"
test_cmd = "npm test"
# Paths that are not product code. Planted bugs go only into files NOT listed here,
# and the commit hook does not ask for a claim covering them.
ignore = ["*.md", "docs/**", ".claimcheck/**", "*.lock", "*.txt", ".gitignore", ".github/**", "package-lock.json", "pnpm-lock.yaml", "tests/**", "**/tests/**", "test/**", "**/test/**", "**/*.test.ts", "fixtures/**", "**/fixtures/**"]
require_full_coverage = true

[checker]
provider = "auto"            # "auto" | "claude" | "claude-cli" | "openai" | "stub"
model = "claude-opus-5-5"
# true: a claim the checker cannot settle (UNVERIFIABLE) fails the run with exit 9, until a
# person accepts it with `claimcheck accept <id> --note "..."`. false: it is only a warning.
fail_on_unverifiable = true

[mutate]
max_mutants = 50
timeout_s = 600
min_catch_rate = 0.0         # 0.0 = report only; raise it to make `mutate` a gate
